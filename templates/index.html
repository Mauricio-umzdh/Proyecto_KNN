<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KNN Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            background: linear-gradient(135deg,#0f172a,#111827,#1e293b);

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;
        }

        .container{

            width:90%;
            max-width:700px;

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.1);

            backdrop-filter:blur(10px);

            padding:40px;

            border-radius:20px;

            box-shadow:0 0 25px rgba(0,255,255,0.2);
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#00ffff;
        }

        .grupo{

            margin-bottom:20px;
        }

        label{

            display:block;
            margin-bottom:8px;
        }

        input, select{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            background:#1e293b;

            color:white;

            font-size:16px;
        }

        input:focus,
        select:focus{

            outline:none;

            box-shadow:0 0 10px cyan;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:cyan;

            color:black;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.03);

            box-shadow:0 0 20px cyan;
        }

        .resultado{

            margin-top:25px;

            text-align:center;

            padding:20px;

            border-radius:12px;

            background:#0f172a;

            border:1px solid cyan;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Predicción de Impacto en Redes Sociales</h1>

        <form action="/predecir" method="POST">

            <div class="grupo">
                <label>Edad</label>
                <input type="number" name="Age" min="1" max="122" required>
            </div>

            <div class="grupo">
                <label>Género</label>
                <select name="Gender" required>
                    <option value="0">Femenino</option>
                    <option value="1">Masculino</option>
                </select>
            </div>

            <div class="grupo">
                <label>Nivel Académico</label>
                <select name="Academic_Level" required>
                    <option value="1">Secundario</option>
                    <option value="2">Licenciatura</option>
                    <option value="3">Graduado</option>
                </select>
            </div>

            <div class="grupo">
                <label>Plataforma Más Usada</label>
                <select name="Most_Used_Platform" required>

                    <option value="1">Facebook</option>
                    <option value="2">Instagram</option>
                    <option value="3">LinkedIn</option>
                    <option value="4">Snapchat</option>
                    <option value="5">TikTok</option>
                    <option value="6">Twitter/X</option>
                    <option value="7">YouTube</option>
                    <option value="8">WhatsApp</option>
                    <option value="9">WeChat</option>
                    <option value="10">KakaoTalk</option>
                    <option value="11">LINE</option>
                    <option value="12">VKontakte</option>
                    <option value="13">Otros</option>

                </select>
            </div>
            
            <div class="grupo">
                <label>Horas de Uso Diario</label>
                <input type="number" name="Avg_Daily_Usage_Hours" min="1" max="24" required>
            </div>



            <div class="grupo">
                <label>¿Afecta el Rendimiento Académico?</label>
                <select name="Affects_Academic_Performance" required>
                    <option value="0">No</option>
                    <option value="1">Sí</option>
                </select>
            </div>

            <div class="grupo">
                <label>Horas de Sueño por Noche</label>
                <input type="number" name="Sleep_Hours_Per_Night" min="1" max="24" required>
            </div>

            <div class="grupo">
                <label>Puntaje de Salud Mental</label>
                <input type="number" name="Mental_Health_Score" min="1" max="10" required>
            </div>

            <button type="submit">
                PREDECIR IMPACTO
            </button>

        </form>

        {% if prediccion %}

        <div class="resultado">

            <h2>Resultado:</h2>

            <h1>{{ prediccion }}</h1>

        </div>

        {% endif %}

    </div>

</body>
</html>
