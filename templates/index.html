<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicción de Impacto en Redes Sociales</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );

            color:white;

            padding:20px;
        }

        .container{

            width:100%;
            max-width:750px;

            background:rgba(255,255,255,0.05);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.1);

            border-radius:25px;

            padding:40px;

            box-shadow:
                0 0 30px rgba(0,255,255,0.2);

        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#00ffff;
        }

        .grupo{

            margin-bottom:18px;
        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;
        }

        input,
        select{

            width:100%;

            padding:12px;

            border-radius:12px;

            border:1px solid rgba(255,255,255,0.15);

            background:#1e293b;

            color:white;

            font-size:15px;
        }

        input:focus,
        select:focus{

            outline:none;

            box-shadow:0 0 12px cyan;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:15px;

            background:cyan;

            color:black;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.02);

            box-shadow:0 0 20px cyan;
        }

        .resultado{

            margin-top:25px;

            text-align:center;

            padding:20px;

            border-radius:15px;

            font-size:20px;

            font-weight:bold;
        }

        .negativo{

            background:#3b0d0d;
            border:2px solid red;
            color:#ff7a7a;
        }

        .neutral{

            background:#3d3608;
            border:2px solid gold;
            color:#ffe066;
        }

        .positivo{

            background:#083d1c;
            border:2px solid lime;
            color:#8cff8c;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Predicción de Impacto en Redes Sociales</h1>

    <form action="/predecir" method="POST">

        <div class="grupo">
            <label>Edad</label>
            <input
                type="number"
                name="Age"
                min="1"
                max="122"
                step="1"
                required
            >
        </div>

        <div class="grupo">
            <label>Género</label>

            <select name="Gender" required>

                <option value="0">Femenino</option>
                <option value="1">Masculino</option>

            </select>

        </div>

        <div class="grupo">
            <label>Nivel Académico</label>

            <select name="Academic_Level" required>

                <option value="1">Secundario</option>
                <option value="2">Licenciatura</option>
                <option value="3">Graduado</option>

            </select>

        </div>

        <div class="grupo">
            <label>Plataforma Más Utilizada</label>

            <select name="Most_Used_Platform" required>

                <option value="1">Facebook</option>
                <option value="2">Instagram</option>
                <option value="3">LinkedIn</option>
                <option value="4">Snapchat</option>
                <option value="5">TikTok</option>
                <option value="6">Twitter/X</option>
                <option value="7">YouTube</option>
                <option value="8">WhatsApp</option>
                <option value="9">WeChat</option>
                <option value="10">KakaoTalk</option>
                <option value="11">LINE</option>
                <option value="12">VKontakte</option>
                <option value="13">Otros</option>

            </select>

        </div>

        <div class="grupo">
            <label>Horas de Uso Diario</label>

            <input
                type="number"
                name="Avg_Daily_Usage_Hours"
                min="1"
                max="24"
                step="1"
                required
            >
        </div>

        <div class="grupo">
            <label>¿Afecta el Rendimiento Académico?</label>

            <select
                name="Affects_Academic_Performance"
                required
            >

                <option value="0">No</option>
                <option value="1">Sí</option>

            </select>

        </div>

        <div class="grupo">
            <label>Horas de Sueño por Noche</label>

            <input
                type="number"
                name="Sleep_Hours_Per_Night"
                min="1"
                max="24"
                step="1"
                required
            >
        </div>

        <div class="grupo">
            <label>Puntaje de Salud Mental (1.0 - 10.0)</label>

            <input
                type="number"
                name="Mental_Health_Score"
                min="1"
                max="10"
                step="0.1"
                required
            >
        </div>

        <button type="submit">

            PREDECIR IMPACTO

        </button>

    </form>

    {% if prediccion is not none %}

        {% if prediccion == 0 %}

            <div class="resultado negativo">

                Resultado: NEGATIVO

            </div>

        {% elif prediccion == 1 %}

            <div class="resultado neutral">

                Resultado: NEUTRAL

            </div>

        {% elif prediccion == 2 %}

            <div class="resultado positivo">

                Resultado: POSITIVO

            </div>

        {% endif %}

    {% endif %}

</div>

<script>

document.querySelectorAll('input[type="number"]').forEach(input => {

    input.addEventListener('input', function() {

        this.value = this.value.replace('-', '');

        if(this.name === 'Mental_Health_Score'){

            let valor = this.value;

            valor = valor.replace(/[^0-9.]/g,'');

            let partes = valor.split('.');

            if(partes.length > 2){

                valor = partes[0] + '.' + partes[1];
            }

            if(partes[1]){

                valor = partes[0] + '.' + partes[1].substring(0,1);
            }

            this.value = valor;
        }
    });
});

</script>

</body>
</html>
